# Reproduces the original residual-RL setup exactly: sparse pick_and_place
# success reward only, always resets to the single fixed starting pose, no
# early truncation. Kept as a regression baseline / A-B comparison point.
rewards:
  reach:
    enabled: false
  dist:
    enabled: false
resets:
  default: 1.0
early_truncation:
  enabled: false
