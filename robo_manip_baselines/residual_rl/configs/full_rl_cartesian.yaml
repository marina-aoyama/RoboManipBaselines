# Full RL baseline, but in Cartesian (end-effector) action space instead of
# raw joint targets: the [-1,1] action is a small xyz+rpy delta (solved to
# joint targets via IK), not an absolute actuator target -- avoids the wild,
# full-range joint swings a randomly-exploring policy commands in joint-space
# full RL (configs/full_rl.yaml). Workspace bounds truncate the episode if
# the gripper wanders out of a sane box, since nothing else (no ACT prior)
# otherwise keeps an early, mostly-random policy anywhere near sensible.
policy_mode: full
full_rl:
  action_space: cartesian
  cartesian_pos_scale: 0.02   # meters of eef translation per RL step
  cartesian_rot_scale: 0.1    # radians of eef rotation per RL step
workspace_bounds:
  enabled: true
  x_min: -0.5
  x_max: 0.5
  y_min: -0.6
  y_max: 0.6
  z_min: 0.7
  z_max: 1.3
# reach/dist reward the *reduction* in distance since the last step (progress
# reward), not absolute proximity -- see RewardTermConfig's docstring in
# config.py.
rewards:
  reach:
    enabled: true
    weight: 5.0
  dist:
    enabled: true
    weight: 5.0
resets:
  default: 0.1
  near_object: 0.3
  stable_grasp: 0.3
  near_goal: 0.3
early_truncation:
  enabled: true
  patience_seconds: 5.0
  reach_threshold: 0.3
