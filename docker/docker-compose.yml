services:
  robomanip:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: robo-manip-baselines:act
    container_name: robo_manip_baselines
    shm_size: '2gb'
    environment:
      - DISPLAY=${DISPLAY}
      - MUJOCO_GL=glfw
      - QT_X11_NO_MITSHM=1
      # Without this the NVIDIA container runtime only exposes compute/utility
      # libs, so MuJoCo's GLX viewer falls back to Mesa's software rasterizer
      # (swrast_dri.so) and the render loop crawls even though physics/policy
      # run fine on the GPU.
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      # X11 socket — lets the MuJoCo viewer / teleop GUI show on the host display
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Bind-mount the whole repo so source edits (host or in-container) are
      # shared live, not baked in only at `docker compose build` time via COPY.
      - ..:/workspace/RoboManipBaselines
    devices:
      # SpaceMouse (USB HID) passthrough
      - /dev/bus/usb:/dev/bus/usb
    # Simplest way to guarantee hidraw/USB access for the SpaceMouse without
    # hand-picking device nodes/udev rules. Narrow to explicit `devices:` +
    # cap_add if you'd rather not run privileged.
    privileged: true
    # Host networking sidesteps X11/DISPLAY quirks between container and host
    # on Linux. Not needed/available on macOS/Windows.
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    command: /bin/bash
